<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高校教师资格证 · 刷题宝典</title>
<style>
  :root{
    --bg:#f2f4f8; --card:#fff; --text:#1f2430; --sub:#6b7280;
    --primary:#2f6fed; --ok:#12a150; --bad:#e5484d; --line:#e5e8ef;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent;
  }
  /* ---------- 顶部栏 ---------- */
  .topbar{
    position:sticky;top:0;z-index:30;background:#fff;
    border-bottom:1px solid var(--line);box-shadow:0 1px 6px rgba(20,30,60,.05);
  }
  .bar-inner{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:16px;letter-spacing:.3px}
  .brand em{color:var(--primary);font-style:normal}
  .stats{margin-left:auto;display:flex;gap:14px;font-size:13px;color:var(--sub);flex-wrap:wrap}
  .stats b{color:var(--text)}
  .tools{max-width:880px;margin:0 auto;padding:0 16px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
  .chk{display:flex;align-items:center;gap:5px;color:var(--sub);cursor:pointer;user-select:none}
  select{
    padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;
    font-size:13px;color:var(--text);outline:none;font-family:inherit;
  }
  .btn{
    padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;
    color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;
  }
  .btn:hover:not(:disabled){border-color:#c7cede;background:#f7f9fc}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover:not(:disabled){background:#2560d8}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.on{background:#eef4ff;border-color:var(--primary);color:var(--primary)}

  /* ---------- 主卡片 ---------- */
  .wrap{max-width:880px;margin:0 auto;padding:18px 16px 60px}
  .card{background:var(--card);border-radius:14px;padding:22px 24px 18px;box-shadow:0 2px 14px rgba(20,30,60,.06)}
  .qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .badge{
    font-size:12px;padding:2px 9px;border-radius:20px;background:#eef4ff;
    color:var(--primary);border:1px solid #d8e4ff;
  }
  .badge.warn{background:#fff7e6;color:#b26a00;border-color:#ffe0a3}
  .qindex{margin-left:auto;font-size:12.5px;color:var(--sub)}
  .qtext{font-size:16.5px;font-weight:600;line-height:1.75;margin:2px 0 16px;white-space:pre-wrap;word-break:break-word}

  /* ---------- 选项 ---------- */
  .option{
    display:flex;gap:10px;align-items:flex-start;
    padding:11px 14px;margin-bottom:9px;border:1.5px solid var(--line);
    border-radius:10px;background:#fff;cursor:pointer;transition:.13s;
  }
  .option:hover:not(.locked){border-color:#b9c6e4;background:#f8faff}
  .option .tag{
    flex:0 0 24px;height:24px;line-height:24px;text-align:center;border-radius:50%;
    background:#eef1f7;color:#5a6478;font-weight:700;font-size:13px;transition:.13s;
  }
  .option .txt{flex:1;white-space:pre-wrap;word-break:break-word}
  .option.sel{border-color:var(--primary);background:#eef4ff}
  .option.sel .tag{background:var(--primary);color:#fff}
  .option.right{border-color:var(--ok);background:#eaf8f0}
  .option.right .tag{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fdeeee}
  .option.wrong .tag{background:var(--bad);color:#fff}
  .option.locked{cursor:default}

  /* ---------- 解析 ---------- */
  .analysis{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
  .ans-line{font-size:14.5px;margin-bottom:6px}
  .ans-line b{color:var(--ok);font-size:16px;letter-spacing:1px}
  .my-ans{font-size:13px;margin-left:10px}
  .my-ans.ok{color:var(--ok)}
  .my-ans.bad{color:var(--bad)}
  .ana-line{
    font-size:14px;color:#3f4759;background:#f7f9fc;border-left:3px solid var(--primary);
    border-radius:0 8px 8px 0;padding:10px 12px;white-space:pre-wrap;word-break:break-word;
  }

  /* ---------- 操作按钮 ---------- */
  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .actions .btn{padding:9px 18px;font-size:14px;border-radius:10px}
  .actions .spacer{flex:1}

  /* ---------- 空状态 ---------- */
  .empty{text-align:center;color:var(--sub);padding:60px 10px;font-size:14px;line-height:2}

  /* ---------- 答题卡抽屉 ---------- */
  .sheet-mask{
    position:fixed;inset:0;background:rgba(15,20,35,.4);opacity:0;pointer-events:none;
    transition:.22s;z-index:40;
  }
  .sheet-mask.show{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;top:0;right:0;height:100%;width:min(420px,88vw);background:#fff;
    transform:translateX(102%);transition:transform .25s ease;z-index:50;
    display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(20,30,60,.12);
  }
  .sheet.show{transform:none}
  .sheet-head{
    padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;
    font-weight:700;font-size:15px;
  }
  .sheet-head .btn{margin-left:auto;padding:3px 10px}
  .sheet-grid{
    flex:1;overflow-y:auto;padding:14px 16px;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px;align-content:start;
  }
  .cell{
    height:38px;border-radius:8px;border:1.5px solid var(--line);background:#fff;
    font-size:13px;color:#5a6478;cursor:pointer;font-family:inherit;transition:.13s;
  }
  .cell:hover{border-color:#b9c6e4}
  .cell.ok{background:#eaf8f0;border-color:var(--ok);color:var(--ok);font-weight:700}
  .cell.bad{background:#fdeeee;border-color:var(--bad);color:var(--bad);font-weight:700}
  .cell.active{outline:2px solid var(--primary);outline-offset:1px}
  .cell.disputed{position:relative}
  .cell.disputed::after{
    content:'';position:absolute;top:2px;right:3px;width:5px;height:5px;
    border-radius:50%;background:#f0a020;
  }
  .sheet-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px}
  .sheet-foot .btn{flex:1;padding:9px;font-size:13.5px}

  @media (max-width:560px){
    .card{padding:18px 16px 14px;border-radius:12px}
    .qtext{font-size:16px}
    .brand{font-size:15px}
    .stats{width:100%;margin-left:0;justify-content:space-between;gap:6px}
  }
</style>
</head>

/* ==========================================================================
   ② 引擎代码 —— 一般不需要改动
   ========================================================================== */
const LETTERS = ['A','B','C','D','E','F','G','H','I','J'];
const $ = id => document.getElementById(id);

const el = {
  stats: $('stats'), skipDisputed: $('skipDisputed'), modeSel: $('modeSel'),
  btnWrongOnly: $('btnWrongOnly'), btnRestart: $('btnRestart'), btnSheet: $('btnSheet'),
  emptyTip: $('emptyTip'), qArea: $('qArea'),
  qType: $('qType'), qDisputed: $('qDisputed'), qIndex: $('qIndex'), qText: $('qText'),
  options: $('options'), analysis: $('analysis'), ansText: $('ansText'),
  myAns: $('myAns'), anaText: $('anaText'),
  btnPrev: $('btnPrev'), btnSubmit: $('btnSubmit'), btnSkip: $('btnSkip'), btnNext: $('btnNext'),
  sheet: $('sheet'), sheetMask: $('sheetMask'), sheetGrid: $('sheetGrid'),
  btnSheetClose: $('btnSheetClose'), btnFilterAll: $('btnFilterAll'), btnFilterWrong: $('btnFilterWrong')
};

/* ---------- 工具函数 ---------- */
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function stripPrefix(s){
  return String(s == null ? '' : s).replace(/^\s*[A-Ja-j]\s*[\.、\)）:：]\s*/, '').trim();
}
function normAnswer(rawAns, opts){
  if (rawAns == null) return [];
  let arr = Array.isArray(rawAns) ? rawAns.map(x => String(x).trim()) : [String(rawAns).trim()];
  const out = [];
  for (const x of arr){
    const up = x.toUpperCase();
    if (/^[A-J]+$/.test(up)){ out.push(...up.split('')); continue; }
    if (/^[A-J、,，\s\/]+$/.test(up) && /[A-J]/.test(up)){ out.push(...(up.match(/[A-J]/g) || [])); continue; }
    const i = opts.findIndex(o => o.trim() === x || o.trim().toUpperCase() === up);
    if (i >= 0){ out.push(LETTERS[i]); continue; }
    if (/^(正确|对|是|√|T|TRUE)$/i.test(x)){ out.push('A'); continue; }
    if (/^(错误|错|否|×|F|FALSE)$/i.test(x)){ out.push('B'); continue; }
  }
  return [...new Set(out)];
}
function normalizeQuestion(raw, idx){
  const q = Object.assign({}, raw);
  q._i = idx;
  q.id = (raw.id != null) ? raw.id : (idx + 1);
  q.disputed = raw.disputed === true || raw.disputed === 1 || raw.disputed === 'true';
  q.question = raw.question || raw.title || raw.stem || '';

  // 题型
  const tRaw = String(raw.type || raw.questionType || '');
  let type;
  if (/多选/.test(tRaw)) type = 'multiple';
  else if (/判断/.test(tRaw)) type = 'judge';
  else if (/单选/.test(tRaw)) type = 'single';
  else if (['single','multiple','judge'].includes(tRaw)) type = tRaw;
  else type = null;

  // 选项
  let opts = raw.options || raw.opts || raw.choices || [];
  if (typeof opts === 'string') opts = opts.split(/\r?\n|；|;/);
  opts = (opts || []).map(stripPrefix).filter(o => String(o).trim() !== '');
  if (opts.length === 0 && type === 'judge') opts = ['正确', '错误'];
  q.options = opts;

  // 答案
  q.answerArr = normAnswer(raw.answer != null ? raw.answer : raw.answers, q.options);

  // 兜底推断题型
  if (!type) type = (q.answerArr.length > 1) ? 'multiple' : 'single';
  q.type = type;

  q.analysis = raw.analysis || raw.explain || raw.explanation || '';
  return q;
}
function sameSet(a, b){
  if (a.length !== b.length) return false;
  const x = [...a].sort().join(''), y = [...b].sort().join('');
  return x === y;
}

/* ---------- 状态 ---------- */
let bank = [];              // 规范化后的题库
let queue = [];             // 当前答题序列（存 bank 下标）
let cur = 0;                // queue 中的位置
let records = {};           // bank下标 -> {selected:[], submitted:bool, correct:bool}
let filterMode = 'all';     // 'all' | 'wrong'

/* ---------- 初始化 ---------- */
function init(){
  bank = (QUESTION_BANK || []).map(normalizeQuestion);
  rebuild(false);
  bindEvents();
}

/* ---------- 重建队列 ---------- */
function rebuild(keepRecords){
  if (!keepRecords){ records = {}; }
  let idxs = bank.map((q, i) => i);

  if (el.skipDisputed.checked) idxs = idxs.filter(i => !bank[i].disputed);

  if (filterMode === 'wrong'){
    idxs = idxs.filter(i => records[i] && records[i].submitted && !records[i].correct);
  }
  if (el.modeSel.value === 'random') shuffle(idxs);

  queue = idxs;
  cur = 0;
  el.btnWrongOnly.classList.toggle('on', filterMode === 'wrong');
  el.btnWrongOnly.textContent = filterMode === 'wrong' ? '返回全部' : '只刷错题';
  render();
}

/* ---------- 渲染 ---------- */
function render(){
  updateStats();
  const hasQ = queue.length > 0;
  el.qArea.hidden = !hasQ;
  el.emptyTip.hidden = hasQ;

  if (!hasQ){
    if (!bank.length){
      el.emptyTip.innerHTML = '题库为空<br><span style="font-size:13px">请把题目粘贴到脚本里的 <b>QUESTION_BANK</b> 数组中</span>';
    } else if (filterMode === 'wrong'){
      el.emptyTip.textContent = '当前没有错题，去刷全部题目吧～';
    } else {
      el.emptyTip.textContent = '当前筛选条件下没有题目（可能全部被"跳过争议题"过滤了）。';
    }
    renderSheet();
    return;
  }

  if (cur < 0) cur = 0;
  if (cur > queue.length - 1) cur = queue.length - 1;

  const bi = queue[cur];
  const q = bank[bi];
  const rec = records[bi];
  const submitted = !!(rec && rec.submitted);

  el.qType.textContent = { single:'单选题', multiple:'多选题', judge:'判断题' }[q.type] || '单选题';
  el.qDisputed.hidden = !q.disputed;
  el.qIndex.textContent = `第 ${cur + 1} / ${queue.length} 题　(题库 #${q.id})`;
  el.qText.textContent = q.question;

  // 选项
  el.options.innerHTML = '';
  q.options.forEach((text, i) => {
    const L = LETTERS[i];
    const isSel = !!(rec && rec.selected.includes(L));
    const isAns = q.answerArr.includes(L);

    const div = document.createElement('div');
    div.className = 'option';
    if (submitted){
      div.classList.add('locked');
      if (isAns) div.classList.add('right');
      else if (isSel) div.classList.add('wrong');
    } else if (isSel){
      div.classList.add('sel');
    }

    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = L;
    const txt = document.createElement('span');
    txt.className = 'txt';
    txt.textContent = text;
    div.appendChild(tag);
    div.appendChild(txt);

    if (!submitted) div.addEventListener('click', () => onPick(L));
    el.options.appendChild(div);
  });

  // 解析
  if (submitted){
    el.analysis.hidden = false;
    el.ansText.textContent = q.answerArr.join('') || '—';
    el.myAns.textContent = `　你的答案：${rec.selected.join('') || '未选'}　${rec.correct ? '✅ 正确' : '❌ 错误'}`;
    el.myAns.className = 'my-ans ' + (rec.correct ? 'ok' : 'bad');
    el.anaText.textContent = q.analysis || '（本题暂无解析）';
  } else {
    el.analysis.hidden = true;
  }

  // 按钮状态
  const isMulti = q.type === 'multiple';
  el.btnSubmit.hidden = !isMulti || submitted;
  el.btnSubmit.disabled = !(rec && rec.selected.length);
  el.btnPrev.disabled = cur === 0;
  el.btnNext.disabled = cur === queue.length - 1;

  renderSheet();
}

/* ---------- 答题卡 ---------- */
function renderSheet(){
  el.sheetGrid.innerHTML = '';
  queue.forEach((bi, i) => {
    const rec = records[bi];
    const b = document.createElement('button');
    b.className = 'cell';
    b.textContent = i + 1;
    if (rec && rec.submitted) b.classList.add(rec.correct ? 'ok' : 'bad');
    if (i === cur) b.classList.add('active');
    if (bank[bi] && bank[bi].disputed) b.classList.add('disputed');
    b.addEventListener('click', () => { cur = i; render(); closeSheet(); });
    el.sheetGrid.appendChild(b);
  });
}

/* ---------- 统计 ---------- */
function updateStats(){
  let done = 0, right = 0;
  Object.keys(records).forEach(k => {
    const r = records[k];
    if (r && r.submitted){ done++; if (r.correct) right++; }
  });
  const wrong = done - right;
  const rate = done ? Math.round(right / done * 100) : 0;
  el.stats.innerHTML =
    `已答 <b>${done}</b>/<b>${bank.length}</b>` +
    `<span>✅ <b style="color:var(--ok)">${right}</b></span>` +
    `<span>❌ <b style="color:var(--bad)">${wrong}</b></span>` +
    `<span>正确率 <b>${rate}%</b></span>`;
}

/* ---------- 交互 ---------- */
function onPick(L){
  const bi = queue[cur];
  const q = bank[bi];
  let rec = records[bi];
  if (!rec) rec = records[bi] = { selected: [], submitted: false, correct: false };
  if (rec.submitted) return;

  if (q.type === 'multiple'){
    const i = rec.selected.indexOf(L);
    if (i >= 0) rec.selected.splice(i, 1);
    else rec.selected.push(L);
    rec.selected.sort();
    render();
  } else {
    rec.selected = [L];
    doSubmit();
  }
}

function doSubmit(){
  const bi = queue[cur];
  const q = bank[bi];
  const rec = records[bi];
  if (!rec || rec.submitted || !rec.selected.length) return;
  rec.submitted = true;
  rec.correct = sameSet(rec.selected, q.answerArr);
  render();
}

function go(delta){
  if (!queue.length) return;
  const n = cur + delta;
  if (n < 0 || n > queue.length - 1) return;
  cur = n;
  render();
}

/* ---------- 事件绑定 ---------- */
function bindEvents(){
  el.btnPrev.addEventListener('click', () => go(-1));
  el.btnNext.addEventListener('click', () => go(1));
  el.btnSkip.addEventListener('click', () => go(1));
  el.btnSubmit.addEventListener('click', doSubmit);

  el.btnRestart.addEventListener('click', () => {
    filterMode = 'all';
    rebuild(false);
  });

  el.btnWrongOnly.addEventListener('click', () => {
    filterMode = (filterMode === 'wrong') ? 'all' : 'wrong';
    rebuild(true);
  });

  el.skipDisputed.addEventListener('change', () => rebuild(true));
  el.modeSel.addEventListener('change', () => rebuild(true));

  el.btnSheet.addEventListener('click', openSheet);
  el.btnSheetClose.addEventListener('click', closeSheet);
  el.sheetMask.addEventListener('click', closeSheet);
  el.btnFilterAll.addEventListener('click', () => { filterMode = 'all'; rebuild(true); closeSheet(); });
  el.btnFilterWrong.addEventListener('click', () => { filterMode = 'wrong'; rebuild(true); closeSheet(); });

  // 键盘快捷键
  document.addEventListener('keydown', e => {
    if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
    if (!queue.length) return;
    if (e.key === 'ArrowLeft'){ go(-1); return; }
    if (e.key === 'ArrowRight'){ go(1); return; }
    if (e.key === 'Enter'){
      const bi = queue[cur], q = bank[bi], rec = records[bi];
      if (q.type === 'multiple' && !(rec && rec.submitted)) doSubmit();
      else go(1);
      return;
    }
    const k = e.key.toUpperCase();
    const idx = LETTERS.indexOf(k);
    if (idx >= 0){
      const q = bank[queue[cur]];
      if (q && idx < q.options.length) onPick(k);
    }
  });
}

function openSheet(){ el.sheet.classList.add('show'); el.sheetMask.classList.add('show'); }
function closeSheet(){ el.sheet.classList.remove('show'); el.sheetMask.classList.remove('show'); }

/* ---------- 启动 ---------- */
init();
</script>
